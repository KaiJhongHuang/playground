<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOPIK 초급 단어장</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@400;700&display=swap');

:root{
  --paper:#fbfbf6;
  --grid:#e2e9f2;
  --ink:#22344f;
  --ink-soft:#5b6b85;
  --red:#c0392b;
  --red-soft:#e9c6c1;
  --green:#3f7a54;
  --highlight:#f2d57e;
  --card-bg:#ffffff;
  --radius:12px;
  --shadow:0 4px 16px rgba(34,52,79,0.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Noto Sans KR',sans-serif;
  color:var(--ink);
  background:
    repeating-linear-gradient(to bottom, transparent 0 31px, var(--grid) 31px 32px),
    var(--paper);
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer;}
.app{display:flex;min-height:100vh;max-width:1160px;margin:0 auto;}

/* ---------- sidebar tabs ---------- */
.tabs{
  width:150px;flex-shrink:0;
  display:flex;flex-direction:column;
  gap:10px;
  padding:28px 0 28px 18px;
}
.tab-btn{
  position:relative;
  background:#eef1f6;
  color:var(--ink-soft);
  border:1px solid #dbe1ea;
  border-right:none;
  border-radius:10px 0 0 10px;
  padding:14px 10px 14px 16px;
  font-size:14px;
  font-weight:700;
  text-align:left;
  letter-spacing:.02em;
  transition:transform .15s ease, background .15s ease, color .15s ease;
}
.tab-btn .sub{display:block;font-weight:400;font-size:11px;color:var(--ink-soft);margin-top:2px;font-family:'Noto Sans KR';}
.tab-btn.active{
  background:var(--card-bg);
  color:var(--ink);
  border-color:#e4e4e0;
  transform:translateX(10px);
  box-shadow:var(--shadow);
}
.tab-btn.active .sub{color:var(--ink-soft);}
.tab-btn:not(.active):hover{background:#e5e9f0;transform:translateX(3px);}
.tab-badge{
  display:inline-block;margin-left:6px;
  background:var(--red);color:#fff;font-size:10px;font-weight:700;
  border-radius:8px;padding:1px 6px;vertical-align:middle;
}

/* ---------- page ---------- */
.page{
  flex:1;
  background:var(--card-bg);
  border-radius:0 10px 10px 10px;
  box-shadow:var(--shadow);
  margin:28px 24px 28px 0;
  position:relative;
  padding:34px 40px 40px 54px;
  min-height:80vh;
  overflow:hidden;
}
.page::before{
  content:"";position:absolute;left:34px;top:0;bottom:0;width:2px;background:var(--red-soft);
}
.page::after{
  content:"";position:absolute;left:22px;top:0;bottom:0;width:14px;
  background-image:radial-gradient(circle at 7px 0, transparent 5px, var(--card-bg) 5.5px);
  background-size:14px 32px; background-repeat:repeat-y;
}

.masthead{display:flex;align-items:center;gap:18px;margin-bottom:22px;flex-wrap:wrap;}
.stamp{
  width:66px;height:66px;border-radius:50%;
  border:3px solid var(--red);
  color:var(--red);
  display:flex;align-items:center;justify-content:center;
  font-family:'Gaegu',cursive;font-weight:700;font-size:13px;line-height:1.15;
  text-align:center;transform:rotate(-9deg);
  flex-shrink:0;
  box-shadow:inset 0 0 0 3px rgba(192,57,43,0.15);
}
h1{
  font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:26px;margin:0 0 4px;color:var(--ink);
}
.subtitle{font-size:13px;color:var(--ink-soft);margin:0;}
.stats-bar{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap;}
.stat-pill{
  background:#f4f6fa;border:1px solid #e2e7ef;border-radius:20px;
  padding:6px 14px;font-size:12px;color:var(--ink-soft);font-weight:500;
}
.stat-pill b{color:var(--ink);font-size:14px;}

.view-section{display:none;}
.view-section.active{display:block;}

/* ---------- chips ---------- */
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.chip{
  background:#f4f6fa;border:1px solid #e2e7ef;color:var(--ink-soft);
  border-radius:16px;padding:6px 14px;font-size:13px;font-weight:500;
}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

/* ---------- search ---------- */
.search-input{
  width:100%;max-width:320px;padding:9px 14px;border-radius:8px;border:1px solid #dbe1ea;
  font-size:14px;margin-bottom:16px;font-family:inherit;background:#fafbfc;
}

/* ---------- word cards (study) ---------- */
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
.word-card{
  background:#fdfdfb;border:1px solid #ececE6;border-radius:var(--radius);
  padding:16px 16px 14px;position:relative;
}
.pos-tag{
  display:inline-block;background:var(--highlight);color:#5a4a12;
  font-size:10px;font-weight:700;border-radius:6px;padding:2px 7px;margin-bottom:8px;
}
.kr-word{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:22px;margin:0 0 2px;display:inline-flex;align-items:center;gap:6px;}
.spk-btn{
  border:none;background:#eef1f6;color:var(--ink);border-radius:50%;
  width:22px;height:22px;font-size:11px;line-height:1;flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;
  vertical-align:middle;transition:background .15s ease, transform .1s ease;
}
.spk-btn:hover{background:var(--highlight);}
.spk-btn:active{transform:scale(0.9);}
.spk-btn.big{width:32px;height:32px;font-size:15px;}
.spk-btn.inline-sm{width:18px;height:18px;font-size:9px;margin-left:4px;}
.ex-kr{font-size:13px;color:var(--ink);display:flex;align-items:flex-start;gap:5px;}
.zh-word{font-size:14px;color:var(--ink-soft);font-weight:700;margin:0 0 10px;}
.ex-block{border-top:1px dashed #e2e2da;padding-top:8px;margin-top:6px;}
.ex-zh{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.star-btn{
  position:absolute;top:12px;right:12px;border:none;background:none;font-size:17px;
  color:#d8dbe2;
}
.star-btn.on{color:var(--red);}

/* ---------- flashcards ---------- */
.flash-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.select-basic{padding:8px 10px;border-radius:8px;border:1px solid #dbe1ea;font-family:inherit;font-size:13px;background:#fafbfc;}
.ghost-btn{background:#f4f6fa;border:1px solid #e2e7ef;border-radius:8px;padding:8px 14px;font-size:13px;color:var(--ink-soft);font-weight:600;}
.ghost-btn.active-on{background:var(--ink);color:#fff;border-color:var(--ink);}
.flash-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;padding:10px 0 20px;}
.flash-counter{font-size:12px;color:var(--ink-soft);}
.resume-tag{color:var(--red);font-family:'Gaegu';font-size:13px;}
.review-flag{color:#c98a1d;font-size:0.7em;margin:0 2px;vertical-align:super;}
.flash-card{
  width:100%;max-width:420px;min-height:230px;border-radius:16px;
  background:linear-gradient(180deg,#ffffff, #fbfbf8);
  border:1px solid #e7e7e0;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:26px;text-align:center;cursor:pointer;user-select:none;
}
.flash-card .fc-pos{position:absolute;}
.flash-front .fc-kr{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:36px;display:inline-flex;align-items:center;gap:8px;}
.ex-line{display:inline-flex;align-items:center;gap:5px;}
.flash-hint{font-size:11px;color:#b7bdc9;margin-top:14px;}
.flash-back .fc-zh{font-size:22px;font-weight:700;}
.flash-back .fc-ex{margin-top:16px;border-top:1px dashed #e2e2da;padding-top:12px;font-size:14px;color:var(--ink);}
.flash-back .fc-exzh{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
.flash-btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.nav-btn{background:#eef1f6;border:1px solid #dbe1ea;border-radius:8px;padding:10px 16px;font-weight:600;font-size:13px;color:var(--ink);}
.know-btn{background:#eaf3ec;border:1px solid #bfe0c8;color:var(--green);border-radius:8px;padding:10px 18px;font-weight:700;font-size:13px;}
.dontknow-btn{background:#faeceb;border:1px solid #edc3bd;color:var(--red);border-radius:8px;padding:10px 18px;font-weight:700;font-size:13px;}
.empty-msg{color:var(--ink-soft);font-size:14px;padding:30px 0;text-align:center;font-family:'Gaegu';font-size:16px;}

/* ---------- quiz ---------- */
.quiz-setup{max-width:460px;}
.field-row{margin-bottom:16px;}
.field-row label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
.radio-row{display:flex;gap:16px;font-size:13px;}
.primary-btn{
  background:var(--ink);color:#fff;border:none;border-radius:8px;padding:12px 22px;font-weight:700;font-size:14px;
}
.primary-btn:hover{background:#2c4266;}
.quiz-progress{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
.progress-track{height:6px;background:#eef1f6;border-radius:4px;overflow:hidden;margin-bottom:22px;}
.progress-fill{height:100%;background:var(--ink);transition:width .25s ease;}
.quiz-question{
  font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:28px;text-align:center;
  padding:26px 10px;margin-bottom:6px;
}
.quiz-question.zh-mode{font-family:'Noto Sans KR';font-size:22px;}
.quiz-question{display:flex;align-items:center;justify-content:center;gap:10px;}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px;margin:0 auto;}
.opt-btn{
  background:#fdfdfb;border:2px solid #ececE6;border-radius:10px;padding:14px 10px;font-size:15px;font-weight:600;
  color:var(--ink);text-align:center;
}
.opt-btn:disabled{cursor:default;}
.opt-btn.correct{background:#eaf3ec;border-color:var(--green);color:var(--green);}
.opt-btn.wrong{background:#faeceb;border-color:var(--red);color:var(--red);}
.quiz-footer{display:flex;justify-content:center;margin-top:26px;}
.result-wrap{text-align:center;padding:10px 0;}
.result-score{font-family:'Nanum Myeongjo',serif;font-size:42px;font-weight:800;}
.result-note{font-family:'Gaegu';font-size:16px;color:var(--red);margin-top:4px;}
.result-wrongs{margin:22px auto 8px;max-width:440px;text-align:left;}
.result-wrongs .rw-item{
  display:flex;justify-content:space-between;border-bottom:1px dashed #e2e2da;padding:8px 4px;font-size:14px;
}
.result-actions{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap;}

/* ---------- wrong notebook ---------- */
.wb-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
.wb-list{display:flex;flex-direction:column;gap:12px;}
.wb-item{
  display:flex;align-items:center;gap:16px;background:#fdfdfb;border:1px solid #ececE6;border-radius:10px;padding:14px 16px;
}
.wb-kr{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:20px;width:110px;flex-shrink:0;}
.wb-zh-wrap{position:relative;display:inline-flex;align-items:center;padding:2px 10px;}
.wb-zh-wrap::before{
  content:"";position:absolute;inset:-2px -6px;border:2px solid var(--red);border-radius:50%;
  transform:rotate(-3deg);
}
.wb-zh{font-size:14px;font-weight:700;color:var(--ink);position:relative;}
.wb-count{font-family:'Gaegu';color:var(--red);font-size:13px;margin-left:auto;flex-shrink:0;}
.wb-remove{background:none;border:1px solid #dbe1ea;border-radius:6px;padding:6px 10px;font-size:12px;color:var(--ink-soft);flex-shrink:0;}
.wb-note{font-family:'Gaegu';color:var(--red);font-size:15px;transform:rotate(-2deg);}


/* ---------- sync ---------- */
.sync-mini{
  margin-top:auto;margin-right:18px;
  display:flex;align-items:center;gap:7px;
  padding:9px 11px;
  background:#eef1f6;border:1px solid #dbe1ea;border-radius:10px;
  font-size:11px;line-height:1.35;color:var(--ink-soft);
  cursor:pointer;text-align:left;font-family:inherit;
}
.sync-mini:hover{background:#e5e9f0;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#b9c2cf;flex-shrink:0;}
.sync-mini.ok .sync-dot{background:var(--green);}
.sync-mini.syncing .sync-dot,.sync-mini.pending .sync-dot{background:#d9a520;}
.sync-mini.error .sync-dot,.sync-mini.offline .sync-dot{background:var(--red);}
.sync-mini.nokey .sync-dot{background:#b9c2cf;}
.key-box{margin-top:4px;}
.key-input{
  width:100%;padding:11px 12px;margin-bottom:10px;
  border:1px solid #dbe1ea;border-radius:8px;background:#fafbfc;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--ink);
}
.key-input:focus{outline:none;border-color:var(--ink-soft);}
.key-shown{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;
  color:var(--ink);background:#f4f6fa;border:1px solid #e2e7ef;
  border-radius:8px;padding:10px 12px;margin-bottom:8px;word-break:break-all;
}
.sync-card{
  border:1px solid #e4e8ee;border-radius:var(--radius);
  padding:20px 22px;margin-bottom:18px;background:#fcfdff;
}
.sync-card h3{margin:0 0 10px;font-size:15px;color:var(--ink);}
.sync-line{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;margin-bottom:6px;}
.sync-note{font-size:12.5px;color:var(--ink-soft);line-height:1.7;margin:0;}
.sync-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
.sync-code{
  width:100%;min-height:96px;margin-top:10px;
  border:1px solid #dbe1ea;border-radius:8px;padding:10px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
  color:var(--ink-soft);background:#fafbfc;resize:vertical;word-break:break-all;
}
.sync-card details{margin-top:16px;border-top:1px dashed #e0e5ec;padding-top:14px;}
.sync-card summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-soft);}
.sync-msg{font-size:12.5px;color:var(--green);margin-top:8px;min-height:1em;}
.sync-msg.err{color:var(--red);}

@media (max-width:760px){
  .app{flex-direction:column;}
  .tabs{flex-direction:row;overflow-x:auto;width:100%;padding:16px 14px;gap:8px;}
  .tab-btn{border-radius:10px;border-right:1px solid #dbe1ea;flex-shrink:0;}
  .tab-btn.active{transform:translateY(-3px);}
  .page{margin:0 14px 20px;padding:26px 20px 30px 34px;}
  .quiz-options{grid-template-columns:1fr;}
  .stats-bar{margin-left:0;}
  .sync-mini{margin:0;flex-shrink:0;align-self:center;}
}
</style>
</head>
<body>

<div class="app">
  <nav class="tabs">
    <button class="tab-btn active" data-view="study" onclick="setView('study')">📖 단어 학습<span class="sub">學習</span></button>
    <button class="tab-btn" data-view="flashcards" onclick="setView('flashcards')">🗂️ 단어 카드<span class="sub">單字卡複習</span></button>
    <button class="tab-btn" data-view="quiz" onclick="setView('quiz')">✏️ 실력 테스트<span class="sub">測驗</span></button>
    <button class="tab-btn" data-view="wrongbook" onclick="setView('wrongbook')">📕 오답노트<span class="sub" id="wb-tab-sub">錯題本</span></button>
    <button class="tab-btn" data-view="sync" onclick="setView('sync')">🔄 동기화<span class="sub">同步</span></button>
    <button class="sync-mini" id="sync-mini" onclick="setView('sync')"><span class="sync-dot"></span><span id="sync-mini-text">확인 중… 檢查中</span></button>
  </nav>

  <main class="page">
    <div class="masthead">
      <div class="stamp">TOPIK<br>초급</div>
      <div>
        <h1>초급 단어장</h1>
        <p class="subtitle">TOPIK 初級核心單字．韓中對照．例句．測驗與錯題複習</p>
      </div>
      <div class="stats-bar" id="stats-bar"></div>
    </div>

    <!-- STUDY -->
    <section class="view-section active" id="view-study">
      <input class="search-input" id="study-search" placeholder="단어 검색 (한국어 또는 중국어)　搜尋單字" oninput="setStudyQuery(this.value)">
      <div class="chip-row" id="study-chips"></div>
      <div class="word-grid" id="study-cards"></div>
    </section>

    <!-- FLASHCARDS -->
    <section class="view-section" id="view-flashcards">
      <div class="flash-toolbar">
        <select class="select-basic" id="flash-cat-select" onchange="startFlash(this.value)"></select>
        <button class="ghost-btn" id="flash-shuffle-btn" onclick="toggleFlashShuffle()">🔀 무작위 섞기</button>
        <button class="ghost-btn" onclick="resetFlash()">↺ 처음부터 다시 · 重新開始</button>
      </div>
      <div id="flash-area"></div>
    </section>

    <!-- QUIZ -->
    <section class="view-section" id="view-quiz">
      <div id="quiz-area"></div>
    </section>

    <!-- WRONG BOOK -->
    <section class="view-section" id="view-wrongbook">
      <div id="wrongbook-area"></div>
    </section>

    <!-- SYNC -->
    <section class="view-section" id="view-sync">
      <div id="sync-area"></div>
    </section>
  </main>
</div>

/* ---- Korean pronunciation (Web Speech API text-to-speech) ---- */
const TTS_SUPPORTED = typeof window!=='undefined' && 'speechSynthesis' in window;
let ttsVoice = null;
function pickKoreanVoice(){
  if(!TTS_SUPPORTED) return;
  const voices = window.speechSynthesis.getVoices();
  ttsVoice = voices.find(v=>v.lang==='ko-KR') || voices.find(v=>v.lang && v.lang.startsWith('ko')) || null;
}
if(TTS_SUPPORTED){
  pickKoreanVoice();
  window.speechSynthesis.onvoiceschanged = pickKoreanVoice;
}
function speak(text, ev){
  if(ev) ev.stopPropagation();
  if(!TTS_SUPPORTED){
    alert('이 브라우저는 음성 재생을 지원하지 않아요 · 此瀏覽器不支援語音播放');
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR';
  u.rate = 0.85;
  if(ttsVoice) u.voice = ttsVoice;
  window.speechSynthesis.speak(u);
}
function esc4js(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function spkBtn(text, cls){
  return '<button class="spk-btn'+(cls?(' '+cls):'')+'" onclick="speak(\''+esc4js(text)+'\', event)" title="발음 듣기 · 播放發音">🔊</button>';
}

/* ---- Korean particle helpers (batchim-aware) ---- */
function hasBatchim(kr){
  const ch = kr[kr.length-1];
  const code = ch.charCodeAt(0);
  if(code<0xAC00||code>0xD7A3) return false;
  return (code-0xAC00)%28!==0;
}
function josa(kr,type){
  const b = hasBatchim(kr);
  if(type==='subj') return b?'이':'가';
  if(type==='topic') return b?'은':'는';
  if(type==='obj') return b?'을':'를';
  if(type==='cop') return b?'이에요':'예요';
  return '';
}

/* ---- example-sentence generator for template (non hand-written) words ---- */
function genExample(w){
  if(w.ex) return {ex:w.ex, exZh:w.exZh};
  const kr=w.kr, zh=w.zh, id=w.id;
  const subj=josa(kr,'subj'), obj=josa(kr,'obj'), cop=josa(kr,'cop');
  switch(w.cat){
    case 'family':
      return {ex:'이 사람은 제 '+kr+'입니다.', exZh:'這位是我的'+zh+'。'};
    case 'food': {
      const v=[
        {ex:'저는 '+kr+obj+' 좋아해요.', exZh:'我喜歡'+zh+'。'},
        {ex:kr+subj+' 맛있어요.', exZh:zh+'很好吃。'},
        {ex:'어제 '+kr+obj+' 먹었어요.', exZh:'昨天吃了'+zh+'。'}
      ];
      return v[id%v.length];
    }
    case 'place': {
      const v=[
        {ex:'저는 '+kr+'에 가요.', exZh:'我去'+zh+'。'},
        {ex:kr+subj+' 여기에서 가까워요.', exZh:zh+'離這裡很近。'}
      ];
      return v[id%v.length];
    }
    case 'daily':
      return {ex:kr+subj+' 필요해요.', exZh:'需要'+zh+'。'};
    case 'calendar':
      if(w.tpl==='month') return {ex:'제 생일은 '+kr+cop, exZh:'我的生日是'+zh+'。'};
      if(w.tpl==='season') return {ex:'저는 '+kr+obj+' 좋아해요.', exZh:'我喜歡'+zh+'。'};
      return {ex:'오늘은 '+kr+cop, exZh:'今天是'+zh+'。'};
    case 'number':
      return {ex:"숫자 '"+kr+"'"+obj+' 배워요.', exZh:'學習數字「'+zh+'」。'};
    case 'counter':
      return {ex:"이건 물건을 세는 단위, '"+kr+"'입니다.", exZh:'這是量詞「'+zh+'」。'};
    case 'position':
      return {ex:'책상 '+kr+'에 있어요.', exZh:'在桌子的'+zh+'。'};
    case 'body':
      return {ex:kr+subj+' 아파요.', exZh:zh+'很痛。'};
    case 'health':
      return {ex:'저는 '+kr+' 때문에 병원에 갔어요.', exZh:'我因為'+zh+'去了醫院。'};
    case 'clothes':
      return {ex:'이 '+kr+subj+' 예뻐요.', exZh:'這個'+zh+'很漂亮。'};
    case 'color':
      return {ex:'저는 '+kr+obj+' 좋아해요.', exZh:'我喜歡'+zh+'。'};
    case 'weather':
      return {ex:kr+subj+' 아름다워요.', exZh:zh+'很美。'};

   進度以 localStorage 為主要儲存（即時、可離線），
   再透過 JSONBin 當跨瀏覽器／跨裝置的同步管道。
   寫入一律「先拉雲端 → 合併 → 寫回」，所以先開哪一台裝置都不會蓋掉新進度。
   合併規則：learned / studied 取聯集，wrong / flashPos 取較大值。 */
const LS_KEY        = 'topik-progress';
const KEY_LS        = 'topik-sync-key';   // 金鑰只存在使用者自己的瀏覽器，不進原始碼
const BIN_ID        = '6a9ce7f3f5f4af5e29701dc1';
const BIN_URL       = 'https://api.jsonbin.io/v3/b/' + BIN_ID;
const PUSH_DEBOUNCE = 4000;   // 存檔後多久才推雲端（省 API 額度）
const PUSH_RETRY    = 30000;  // 推失敗後自己重試的間隔
const PULL_STALE_MS = 30000;  // 回到分頁時，距上次拉取超過這個時間就重拉
const MAX_ID        = 1000;   // 備份碼 bitmap 上限，單字量超過 1000 時要一起調大

const SYNC = { state:'idle', lastPull:0, lastPush:0, pending:false, timer:null, inflight:false, editKey:false };

/* ---------- 同步金鑰（每個瀏覽器自己輸入一次，之後記住） ---------- */
let ACCESS_KEY = '';
function loadKey(){
  try{ ACCESS_KEY = localStorage.getItem(KEY_LS) || ''; }
  catch(e){ ACCESS_KEY = ''; }
}
function setKey(k){
  ACCESS_KEY = k;
  try{ localStorage.setItem(KEY_LS, k); }catch(e){ console.warn('key save failed', e); }
}
function forgetKey(){
  ACCESS_KEY = '';
  try{ localStorage.removeItem(KEY_LS); }catch(e){}
}
function hasKey(){ return ACCESS_KEY.length > 0; }
function maskKey(k){
  return k.length <= 18 ? k.slice(0,4) + '……' : k.slice(0,10) + '……' + k.slice(-6);
}

/* ---------- 快照 / 還原 ---------- */
function snapshot(){
  return {
    learned:[...S.progress.learned],
    studied:[...S.progress.studied],
    wrong:S.progress.wrong,
    flashPos:S.progress.flashPos,
    lastCat:S.progress.lastCat
  };
}
function applySnapshot(d){
  S.progress.learned  = new Set((d.learned||[]).map(Number));
  S.progress.studied  = new Set((d.studied||[]).map(Number));
  S.progress.wrong    = d.wrong||{};
  S.progress.flashPos = d.flashPos||{};
  S.progress.lastCat  = d.lastCat||'all';
}
function mergeProgress(a, b){
  const out = {
    learned:[...new Set([...(a.learned||[]), ...(b.learned||[])].map(Number))],
    studied:[...new Set([...(a.studied||[]), ...(b.studied||[])].map(Number))],
    wrong:{}, flashPos:{},
    lastCat: b.lastCat || a.lastCat || 'all'
  };
  for(const src of [a.wrong||{}, b.wrong||{}])
    for(const k in src) out.wrong[k] = Math.max(out.wrong[k]||0, Number(src[k])||0);
  for(const src of [a.flashPos||{}, b.flashPos||{}])
    for(const k in src) out.flashPos[k] = Math.max(out.flashPos[k]||0, Number(src[k])||0);
  return out;
}

/* 合併結果一定是雲端的超集，所以數量與數值都一樣就代表雲端沒漏東西 */
function sameAsRemote(merged, remote){
  if(merged.learned.length !== (remote.learned||[]).length) return false;
  if(merged.studied.length !== (remote.studied||[]).length) return false;
  const rw = remote.wrong||{}, rf = remote.flashPos||{};
  if(Object.keys(merged.wrong).length !== Object.keys(rw).length) return false;
  for(const k in merged.wrong) if(Number(rw[k]) !== Number(merged.wrong[k])) return false;
  if(Object.keys(merged.flashPos).length !== Object.keys(rf).length) return false;
  for(const k in merged.flashPos) if(Number(rf[k]) !== Number(merged.flashPos[k])) return false;
  return true;
}

/* ---------- 本機 ---------- */
function saveLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(snapshot())); }
  catch(e){ console.warn('local save failed', e); }
}
async function loadProgress(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) applySnapshot(JSON.parse(raw));
  }catch(e){ console.warn('local load failed', e); }
}

/* 全站唯一的存檔入口：本機立即寫，雲端延遲推。
   沒設定金鑰時照樣存本機，只是不上傳。 */
function saveProgress(){
  saveLocal();
  if(!hasKey()){ setSyncState('nokey'); return; }
  SYNC.pending = true;
  setSyncState('pending');
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(pushCloud, PUSH_DEBOUNCE);
}

/* ---------- 雲端 ---------- */
async function cloudGet(){
  const res = await fetch(BIN_URL + '/latest', {
    headers:{'X-Access-Key':ACCESS_KEY}, cache:'no-store'
  });
  if(!res.ok) throw new Error('GET ' + res.status);
  const json = await res.json();
  return json.record || {};
}
async function cloudPut(data){
  const res = await fetch(BIN_URL, {
    method:'PUT',
    headers:{'X-Access-Key':ACCESS_KEY, 'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });
  if(!res.ok) throw new Error('PUT ' + res.status);
}
function failState(){ return navigator.onLine === false ? 'offline' : 'error'; }
/* 失敗或撞上進行中的請求時，排一次重試；不覆蓋已排定的計時器 */
function scheduleRetry(ms){
  if(SYNC.timer) return;
  SYNC.timer = setTimeout(pushCloud, ms);
}

async function pullCloud(){
  if(!hasKey()){ setSyncState('nokey'); return; }
  if(SYNC.inflight) return;
  SYNC.inflight = true; setSyncState('syncing');
  try{
    const remote = await cloudGet();
    const merged = mergeProgress(snapshot(), remote);
    applySnapshot(merged);
    saveLocal();
    SYNC.lastPull = Date.now();
    /* 這台有、雲端沒有的進度要補推上去
       （例如離線背完就關掉，或剛輸入金鑰之前先背了一陣子） */
    if(!sameAsRemote(merged, remote)){
      SYNC.pending = true;
      scheduleRetry(PUSH_DEBOUNCE);
    }
    setSyncState(SYNC.pending ? 'pending' : 'ok');
    refreshAfterSync();
  }catch(e){
    console.warn('pull failed', e);
    setSyncState(failState());
  }finally{ SYNC.inflight = false; }
}

async function pushCloud(){
  clearTimeout(SYNC.timer); SYNC.timer = null;
  if(!hasKey()){ setSyncState('nokey'); return; }
  if(SYNC.inflight){ SYNC.pending = true; scheduleRetry(PUSH_DEBOUNCE); return; }
  SYNC.inflight = true; setSyncState('syncing');
  try{
    const remote = await cloudGet();          // 先拉；拉不到就不寫，避免把雲端蓋掉
    const merged = mergeProgress(snapshot(), remote);
    applySnapshot(merged);
    saveLocal();
    await cloudPut(merged);
    SYNC.pending  = false;
    SYNC.lastPull = SYNC.lastPush = Date.now();
    setSyncState('ok');
    refreshAfterSync();
  }catch(e){
    console.warn('push failed', e);
    SYNC.pending = true;                      // 留著下次再推
    setSyncState(failState());
    scheduleRetry(PUSH_RETRY);                // 網路回來以前自己慢慢重試
  }finally{ SYNC.inflight = false; }
}

/* 雲端資料併進來後重畫；不動單字卡與測驗，以免打斷進行中的操作 */
function refreshAfterSync(){
  renderStats();
  if(S.view === 'study') renderStudy();
  else if(S.view === 'wrongbook') renderWrongbook();
}

/* ---------- 狀態顯示 ---------- */
const SYNC_LABELS = {
  idle:    ['확인 중…', '檢查中'],
  nokey:   ['동기화 미설정', '尚未設定同步'],
  syncing: ['동기화 중…', '同步中'],

  error:   ['동기화 실패', '同步失敗．已存本機']
};
function setSyncState(st){ SYNC.state = st; updateSyncStatus(); }
function updateSyncStatus(){

      : '這台裝置還沒上傳過。';
  }
}

/* ---------- 手動備份碼（JSONBin 掛掉時的逃生口） ---------- */
function idsToBitmap(ids){
  const bytes = new Uint8Array(Math.ceil(MAX_ID/8));
  ids.forEach(id=>{ const i = Number(id)-1; if(i>=0 && i<MAX_ID) bytes[i>>3] |= (1 << (i&7)); });
  let out = '';
  bytes.forEach(b=> out += String.fromCharCode(b));
  return btoa(out);
}
function bitmapToIds(b64){
  const raw = atob(b64), ids = [];
  for(let i=0;i<raw.length;i++){
    const b = raw.charCodeAt(i);
    for(let bit=0;bit<8;bit++) if(b & (1<<bit)) ids.push(i*8 + bit + 1);
  }
  return ids;
}
function makeBackupCode(){
  const p = snapshot();
  const meta = {w:p.wrong, f:p.flashPos, c:p.lastCat};
  return 'TOPIK1.' + idsToBitmap(p.learned) + '.' + idsToBitmap(p.studied) + '.' + btoa(JSON.stringify(meta));
}
function applyBackupCode(code){
  const parts = String(code).trim().split('.');
  if(parts.length !== 4 || parts[0] !== 'TOPIK1') throw new Error('備份碼格式不對');
  const meta = JSON.parse(atob(parts[3]));
  applySnapshot(mergeProgress(snapshot(), {
    learned: bitmapToIds(parts[1]),
    studied: bitmapToIds(parts[2]),
    wrong: meta.w||{}, flashPos: meta.f||{}, lastCat: meta.c||'all'
  }));
  saveLocal();
  refreshAfterSync();
  pushCloud();
}

/* ---------- 金鑰設定的動作 ---------- */
function keyMsg(text, isErr){
  const el = document.getElementById('key-msg');
  if(!el) return;
  el.className = 'sync-msg' + (isErr ? ' err' : '');
  el.textContent = text;
}
function editKey(){ SYNC.editKey = true; renderSyncPanel(); }
function cancelEditKey(){ SYNC.editKey = false; renderSyncPanel(); }
function removeKey(){
  forgetKey();
  SYNC.editKey = false;
  SYNC.pending = false;
  clearTimeout(SYNC.timer); SYNC.timer = null;
  setSyncState('nokey');
  renderSyncPanel();
  keyMsg('已從這台裝置移除金鑰，進度仍留在本機。');
}
/* 存之前先打一次 API 驗證，避免使用者存了一把錯的金鑰卻以為在同步 */
async function submitKey(){
  const input = document.getElementById('sync-key-input');
  const k = (input.value || '').trim();
  if(!k){ keyMsg('請先貼上金鑰。', true); return; }
  keyMsg('확인 중… 驗證中…');
  try{
    const res = await fetch(BIN_URL + '/latest', {
      headers:{'X-Access-Key':k}, cache:'no-store'
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    await res.json();
    setKey(k);
    SYNC.editKey = false;
    renderSyncPanel();
    keyMsg('金鑰已儲存，這個瀏覽器以後會自動同步。');
    pullCloud();
  }catch(e){
    console.warn('key check failed', e);
    keyMsg('這把金鑰用不了（' + e.message + '），請確認後再試一次。', true);
  }
}
function syncMsg(text, isErr){
  const el = document.getElementById('sync-msg');
  if(!el) return;
  el.className = 'sync-msg' + (isErr ? ' err' : '');
  el.textContent = text;
}
function copyBackupCode(){
  const box = document.getElementById('sync-code');
  box.value = makeBackupCode();
  box.select();
  if(navigator.clipboard){
    navigator.clipboard.writeText(box.value)
      .then(()=>syncMsg('已複製到剪貼簿。'), ()=>syncMsg('複製失敗，請手動選取複製。', true));
  }else{
    syncMsg('請手動選取上面的代碼複製。', true);
  }
}
function restoreBackupCode(){
  try{
    applyBackupCode(document.getElementById('sync-code').value);
    syncMsg('已還原並合併進度。');
  }catch(e){
    syncMsg('還原失敗：' + e.message, true);
  }
}

/* ---------- 時序：iOS 分頁可能好幾天不重載，這幾個事件是必要的 ---------- */
function initSync(){
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible'){
      if(Date.now() - SYNC.lastPull > PULL_STALE_MS) pullCloud();
    }else if(SYNC.pending){
      pushCloud();
    }
  });
  window.addEventListener('pageshow', e=>{ if(e.persisted) pullCloud(); });
  window.addEventListener('pagehide', ()=>{ if(SYNC.pending) pushCloud(); });
  window.addEventListener('online',  ()=>{ SYNC.pending ? pushCloud() : pullCloud(); });
  window.addEventListener('offline', ()=> setSyncState('offline'));
}

/* ================= HELPERS ================= */
function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function wordsByCat(cat){ return cat==='all' ? WORDS : WORDS.filter(w=>w.cat===cat); }
function findWord(id){ return WORDS.find(w=>w.id===Number(id)); }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ================= FLASHCARDS ================= */
function renderFlashSetupUI(){
  if(!S.flash.initd){
    S.flash.cat = S.progress.lastCat || 'all';
    S.flash.initd = true;
  }
  const sel = document.getElementById('flash-cat-select');
  sel.innerHTML = Object.keys(CATS).map(k=>'<option value="'+k+'"'+(S.flash.cat===k?' selected':'')+'>'+CATS[k]+'</option>').join('');
  document.getElementById('flash-shuffle-btn').classList.toggle('active-on', S.flash.shuffle);
  if(S.flash.list.length===0) startFlash(S.flash.cat);
  else renderFlash();
}
function startFlash(cat){
  S.flash.cat = cat;
  S.progress.lastCat = cat;
  let list = wordsByCat(cat).slice();
  if(S.flash.shuffle){
    list = shuffleArr(list);
    S.flash.pos = 0;
  }else{
    const saved = S.progress.flashPos[cat];
    S.flash.pos = (typeof saved==='number' && saved < list.length) ? saved : 0;
  }
  S.flash.list = list;
  S.flash.flipped = false;
  saveProgress();
  renderFlash();
}
function saveFlashPos(){
  S.progress.flashPos[S.flash.cat] = S.flash.pos;
  saveProgress();
}
function resetFlash(){
  S.progress.flashPos[S.flash.cat] = 0;
  startFlash(S.flash.cat);
}
function toggleFlashShuffle(){
  S.flash.shuffle = !S.flash.shuffle;
  document.getElementById('flash-shuffle-btn').classList.toggle('active-on', S.flash.shuffle);
  startFlash(S.flash.cat);
}
function flipCard(){
  S.flash.flipped = !S.flash.flipped;
  if(S.flash.flipped){
    const w = S.flash.list[S.flash.pos];
    if(w && !S.progress.studied.has(w.id)){
      S.progress.studied.add(w.id);
      saveProgress();
      renderStats();
    }
  }
  renderFlash();
}
function flashPrev(){
  if(S.flash.pos>0){
    S.flash.pos--; S.flash.flipped=false;
    saveFlashPos();
    renderFlash();
  }
}
function flashMark(known){
  const w = S.flash.list[S.flash.pos];
  if(w){
    if(known){ S.progress.learned.add(w.id); delete S.progress.wrong[w.id]; }
    else{ S.progress.wrong[w.id] = (S.progress.wrong[w.id]||0)+1; }
    S.progress.studied.add(w.id);
    saveProgress();
    renderStats();
  }
  if(S.flash.pos < S.flash.list.length-1){ S.flash.pos++; }
  else{ S.flash.pos = S.flash.list.length; }
  S.flash.flipped = false;
  saveFlashPos();
  renderFlash();
}
function renderFlash(){
  const area = document.getElementById('flash-area');
  const list = S.flash.list;
  if(list.length===0){
    area.innerHTML = '<div class="empty-msg">이 카테고리에 단어가 없어요.</div>';
    return;
  }
  if(S.flash.pos >= list.length){
    area.innerHTML = '<div class="flash-wrap"><p class="empty-msg">🎉 이 카테고리를 모두 복습했어요! · 已複習完這個分類！</p>'+
      '<button class="primary-btn" onclick="startFlash(S.flash.cat)">다시 처음부터 · 重新開始</button></div>';
    return;
  }
  const w = list[S.flash.pos];
  const ex = genExample(w);
  const flag = isFlagged(w.id) ? '<span class="review-flag" title="아직 헷갈리는 단어예요 · 還不熟的單字">★</span>' : '';
  const cardInner = !S.flash.flipped
    ? '<div class="flash-front"><span class="pos-tag">'+w.pos+'</span><p class="fc-kr">'+w.kr+flag+spkBtn(w.kr,'big')+'</p><p class="flash-hint">카드를 클릭해서 뜻 보기 · 點卡片看意思</p></div>'
    : '<div class="flash-back"><p class="fc-zh">'+w.zh+'</p><div class="fc-ex"><span class="ex-line">'+ex.ex+spkBtn(ex.ex,'inline-sm')+'</span><p class="fc-exzh">'+ex.exZh+'</p></div></div>';

  area.innerHTML =
    '<div class="flash-wrap">'+
      '<div class="flash-counter">'+(S.flash.pos+1)+' / '+list.length+(S.flash.pos>0?' <span class="resume-tag">· 이어서 학습 중 繼續上次進度</span>':'')+'</div>'+
      '<div class="flash-card" onclick="flipCard()">'+cardInner+'</div>'+
      '<div class="flash-btn-row">'+
        '<button class="nav-btn" onclick="flashPrev()">← 이전</button>'+
        '<button class="dontknow-btn" onclick="flashMark(false)">✗ 아직 몰라요</button>'+
        '<button class="know-btn" onclick="flashMark(true)">✓ 기억했어요</button>'+
      '</div>'+
    '</div>';
}

/* ================= QUIZ ================= */
function quizSetField(key,val){ S.quiz[key]=val; }
function startQuiz(){
  const catSel = document.getElementById('quiz-cat-select');
  const dirSel = document.querySelector('input[name="quiz-dir"]:checked');
  const totalSel = document.getElementById('quiz-total-select');
  const cat = catSel.value;
  const dir = dirSel ? dirSel.value : 'kr2zh';
  const totalRaw = totalSel.value;

  const pool = wordsByCat(cat);
  if(pool.length < 4){
    alert('이 카테고리는 문제를 만들기에 단어가 부족해요 (4개 이상 필요).');
    return;
  }
  const total = totalRaw==='all' ? pool.length : Math.min(Number(totalRaw), pool.length);
  const chosen = shuffleArr(pool).slice(0,total);
  const questions = chosen.map(w=>{
    const distractorsPool = pool.filter(x=>x.id!==w.id);
    const distractors = shuffleArr(distractorsPool).slice(0,3);
    const options = shuffleArr([w,...distractors]);
    return {word:w, options};
  });
  S.quiz = {phase:'running', cat, dir, total, questions, qIndex:0, score:0, wrongIds:[], answered:false, selectedIdx:null};
  renderQuiz();
}
function quizFromPool(pool, label){
  if(pool.length===0) return;
  const questions = pool.map(w=>{
    const distractorsPool = WORDS.filter(x=>x.id!==w.id);
    const distractors = shuffleArr(distractorsPool).slice(0,3);
    const options = shuffleArr([w,...distractors]);
    return {word:w, options};
  });
  S.quiz = {phase:'running', cat:'all', dir:'kr2zh', total:questions.length, questions, qIndex:0, score:0, wrongIds:[], answered:false, selectedIdx:null};
  setView('quiz');
}
function reviewWrongOnly(){
  const ids = [...new Set(S.quiz.wrongIds)];
  quizFromPool(WORDS.filter(w=>ids.includes(w.id)));
}
function answerQuiz(idx){
  if(S.quiz.answered) return;
  S.quiz.answered = true;
  S.quiz.selectedIdx = idx;
  const q = S.quiz.questions[S.quiz.qIndex];
  const correct = q.options[idx].id === q.word.id;
  if(correct){ S.quiz.score++; }
  else{
    S.quiz.wrongIds.push(q.word.id);
    S.progress.wrong[q.word.id] = (S.progress.wrong[q.word.id]||0)+1;
    saveProgress();
    renderStats();
  }
  renderQuiz();
}
function nextQuiz(){
  if(S.quiz.qIndex < S.quiz.questions.length-1){
    S.quiz.qIndex++; S.quiz.answered=false; S.quiz.selectedIdx=null;
  }else{
    S.quiz.phase='result';
  }
  renderQuiz();
}
function backToSetup(){ S.quiz.phase='setup'; renderQuiz(); }

function renderQuiz(){
  const area = document.getElementById('quiz-area');

  if(S.quiz.phase==='setup'){
    area.innerHTML =
      '<div class="quiz-setup">'+
        '<div class="field-row"><label>범위 선택 · 選擇範圍</label>'+
          '<select class="select-basic" id="quiz-cat-select" style="width:100%;">'+
            Object.keys(CATS).map(k=>'<option value="'+k+'">'+CATS[k]+'</option>').join('')+
          '</select>'+
        '</div>'+
        '<div class="field-row"><label>문제 방향 · 出題方向</label>'+
          '<div class="radio-row">'+
            '<label><input type="radio" name="quiz-dir" value="kr2zh" checked> 한국어 → 중국어</label>'+
            '<label><input type="radio" name="quiz-dir" value="zh2kr"> 중국어 → 한국어</label>'+
          '</div>'+
        '</div>'+
        '<div class="field-row"><label>문제 수 · 題數</label>'+
          '<select class="select-basic" id="quiz-total-select" style="width:100%;">'+
            '<option value="10">10문제</option><option value="20">20문제</option><option value="all">전체 다</option>'+
          '</select>'+
        '</div>'+
        '<button class="primary-btn" onclick="startQuiz()">테스트 시작 · 開始測驗</button>'+
      '</div>';
    return;
  }

  if(S.quiz.phase==='running'){
    const total = S.quiz.questions.length;
    const q = S.quiz.questions[S.quiz.qIndex];
    const pct = Math.round(((S.quiz.qIndex)/total)*100);
    const zhMode = S.quiz.dir==='zh2kr';
    const promptText = zhMode ? q.word.zh : q.word.kr;
    const optLabel = o => zhMode ? o.kr : o.zh;

    const optsHtml = q.options.map((o,idx)=>{
      let cls='opt-btn';
      if(S.quiz.answered){
        if(o.id===q.word.id) cls+=' correct';
        else if(idx===S.quiz.selectedIdx) cls+=' wrong';
      }
      const label = optLabel(o);
      const spk = zhMode ? spkBtn(o.kr,'inline-sm') : '';
      return '<div class="'+cls+'" role="button" tabindex="0" onclick="answerQuiz('+idx+')">'+label+spk+'</div>';
    }).join('');

    area.innerHTML =
      '<div class="quiz-progress">문제 '+(S.quiz.qIndex+1)+' / '+total+'　·　점수 '+S.quiz.score+'</div>'+
      '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%;"></div></div>'+
      '<div class="quiz-question'+(zhMode?' zh-mode':'')+'">'+promptText+(zhMode?'':spkBtn(q.word.kr))+'</div>'+
      '<div class="quiz-options">'+optsHtml+'</div>'+
      '<div class="quiz-footer">'+(S.quiz.answered ? '<button class="primary-btn" onclick="nextQuiz()">'+(S.quiz.qIndex<total-1?'다음 문제 · 下一題':'결과 보기 · 查看結果')+'</button>' : '')+'</div>';
    return;
  }

  if(S.quiz.phase==='result'){
    const total = S.quiz.questions.length;
    const wrongIds = [...new Set(S.quiz.wrongIds)];
    const wrongWords = wrongIds.map(id=>findWord(id)).filter(Boolean);
    area.innerHTML =
      '<div class="result-wrap">'+
        '<div class="result-score">'+S.quiz.score+' / '+total+'</div>'+
        (wrongWords.length>0
          ? '<p class="result-note">틀린 단어는 오답노트에 저장됐어요! · 錯的單字已自動收進錯題本！</p>'+
            '<div class="result-wrongs">'+wrongWords.map(w=>'<div class="rw-item"><span>'+w.kr+'</span><span>'+w.zh+'</span></div>').join('')+'</div>'
          : '<p class="result-note" style="color:var(--green);">완벽해요! 틀린 문제가 없어요 · 全部答對了！</p>')+
        '<div class="result-actions">'+
          (wrongWords.length>0 ? '<button class="ghost-btn" onclick="reviewWrongOnly()">틀린 것만 다시 · 只重測錯題</button>' : '')+
          '<button class="ghost-btn" onclick="backToSetup()">다시 설정 · 重新設定</button>'+
          '<button class="primary-btn" onclick="setView(\'wrongbook\')">오답노트 보기 · 查看錯題本</button>'+
        '</div>'+
      '</div>';
  }
}

/* ================= WRONG NOTEBOOK ================= */
function masteredWrong(id){
  delete S.progress.wrong[id];
  saveProgress();
  renderWrongbook();
  renderStats();
}
function quizAllWrong(){
  const ids = Object.keys(S.progress.wrong).map(Number);
  quizFromPool(WORDS.filter(w=>ids.includes(w.id)));
}
function renderWrongbook(){
  const area = document.getElementById('wrongbook-area');
  const entries = Object.keys(S.progress.wrong)
    .map(id=>({id:Number(id), count:S.progress.wrong[id], word:findWord(id)}))
    .filter(e=>e.word)
    .sort((a,b)=>b.count-a.count);

  if(entries.length===0){
    area.innerHTML = '<div class="empty-msg">아직 오답이 없어요! 테스트나 카드 복습에서 틀리면 여기에 모여요 📕<br>還沒有錯題,測驗或複習卡答錯的單字會自動收錄在這裡。</div>';
    return;
  }
  area.innerHTML =
    '<div class="wb-header"><span class="wb-note">✎ 다시 외워야 할 단어들!</span>'+
      '<button class="primary-btn" onclick="quizAllWrong()">이 단어들로 테스트 · 用這些單字測驗</button></div>'+
    '<div class="wb-list">'+entries.map(e=>
      '<div class="wb-item">'+
        '<span class="wb-kr">'+e.word.kr+'</span>'+
        '<span class="wb-zh-wrap"><span class="wb-zh">'+e.word.zh+'</span></span>'+
        '<span class="wb-count">'+e.count+'번 틀림</span>'+
        '<button class="wb-remove" onclick="masteredWrong('+e.id+')">외웠어요 · 已學會</button>'+
      '</div>'
    ).join('')+'</div>';
}

/* ================= INIT ================= */
(async function init(){
  await loadProgress();
  renderStudy();
  renderStats();
  renderQuiz();
  initSync();
  loadKey();
  if(hasKey()){ setSyncState('idle'); pullCloud(); }
  else setSyncState('nokey');
})();
</script>
